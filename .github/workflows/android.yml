name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write   # lets a failed job publish its error excerpt as a check result

jobs:
  build:
    name: Build, unit tests, simulated devices, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Parser and budget logic tests
        shell: bash
        run: |
          mkdir -p logs
          ./gradlew :core:test --stacktrace 2>&1 | tee logs/core.log

      - name: Build debug and release APKs
        shell: bash
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:compileDebugUnitTestKotlin --continue --stacktrace 2>&1 | tee logs/build.log

      - name: App tests on Android 8.0 to 16 and six screen sizes (Robolectric)
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --continue --stacktrace 2>&1 | tee logs/unit.log

      - name: Lint
        shell: bash
        run: ./gradlew :app:lintDebug --stacktrace 2>&1 | tee logs/lint.log

      - name: Check the release APK requests no internet permission
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The APK requests INTERNET"; exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: spendlens-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Publish failure details
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ci/report-failure.sh "Failure details · build"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-build
          path: |
            core/build/reports/tests
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/test-results

  device-tests:
    name: Emulator · API ${{ matrix.api }} · ${{ matrix.profile }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, arch: x86, profile: pixel_2 }       # Android 8.0
          - { api: 29, arch: x86_64, profile: pixel_3a }   # Android 10
          - { api: 31, arch: x86_64, profile: pixel_5 }    # Android 12
          - { api: 33, arch: x86_64, profile: pixel_6 }    # Android 13
          - { api: 34, arch: x86_64, profile: pixel_c }    # Android 14, 10-inch tablet
          - { api: 35, arch: x86_64, profile: pixel_6 }    # Android 15
          - { api: 36, arch: x86_64, profile: pixel_6 }    # Android 16
          # Android 17 (latest stable update, 37.2) with 16 KB memory pages, as on a Pixel 10.
          # Google names both the platform and the image "android-37.2"; image target google_apis_ps16k.
          - { api: "37.2", target: google_apis_ps16k, arch: x86_64, profile: pixel_6, ram: 4096M, cores: 4, experimental: true }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        shell: bash
        run: |
          mkdir -p logs
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee logs/build.log

      - name: List the Android 17 emulator images on offer
        if: matrix.experimental
        shell: bash
        run: |
          mkdir -p logs
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          "$SDKM" --list 2>/dev/null | grep -E "system-images;android-3[6-9]|platforms;android-3[6-9]" | awk '{print $1}' | sort -u | tee logs/sdk-images.txt || true

      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target || 'google_apis' }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.ram || '3072M' }}
          cores: ${{ matrix.cores || 2 }}
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash ci/device-tests.sh

      - name: Publish device test results
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ci/report-tests.sh "Device results · API ${{ matrix.api }} · ${{ matrix.profile }}"

      - name: Publish failure details
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ci/report-failure.sh "Failure details · API ${{ matrix.api }}"

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-device-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
